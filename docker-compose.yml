services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Roda as migrations e sai. O app só sobe depois que ele termina com sucesso.
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./deployments/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  # Adquirente FALSO (só desenvolvimento). Mesma imagem do app, outro binário.
  # O valor do pagamento escolhe o comportamento: ver `make psp-help`.
  psp:
    build: .
    image: payment-gateway-go:local
    entrypoint: ["psp-simulator"]
    environment:
      PSP_PORT: "9090"
      PSP_SLOW: "3s"
    ports:
      - "${PSP_HOST_PORT:-9091}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Entrega os eventos da outbox aos webhooks dos lojistas. Processo separado do servidor HTTP.
  worker:
    build: .
    image: payment-gateway-go:local
    entrypoint: ["worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL}
      WEBHOOK_POLL_INTERVAL: "300ms"
      WEBHOOK_BASE_BACKOFF: "2s"   # curto para o desenvolvimento; em produção, 10s+
      WEBHOOK_MAX_BACKOFF: "30s"
      WEBHOOK_MAX_ATTEMPTS: "6"
      # O receptor de exemplo mora numa rede privada do Docker: sem isto o SSRF guard o bloquearia.
      # NUNCA ligar em produção.
      WEBHOOK_ALLOW_PRIVATE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Receptor de webhooks de REFERÊNCIA (só desenvolvimento): verifica a assinatura, deduplica
  # pelo event_id e falha as 2 primeiras tentativas de cada evento para exercitar o retry.
  webhook-sink:
    build: .
    image: payment-gateway-go:local
    entrypoint: ["webhook-sink"]
    environment:
      SINK_SECRET: ${SINK_SECRET:-whsec_dev_secret}
      SINK_FAIL_FIRST: "${SINK_FAIL_FIRST:-2}"
    ports:
      - "${SINK_HOST_PORT:-9101}:9100"

  app:
    build: .
    image: payment-gateway-go:local
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PSP_BASE_URL: http://psp:9090
      PSP_ATTEMPT_TIMEOUT: "1s"   # menor que o PSP_SLOW do simulador, para exercitar o timeout
      PSP_MAX_ATTEMPTS: "3"
      PLATFORM_FEE_BPS: "290"
    ports:
      - "${APP_HOST_PORT}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      psp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
